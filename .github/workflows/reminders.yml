# Calls the reminder endpoint every 10 minutes (Vercel's free plan only allows one cron run per day).
# Needs two repository secrets: APP_URL (e.g. https://seu-app.vercel.app) and CRON_SECRET (same value as on Vercel).
name: Lembretes

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar /api/cron/reminders
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail --silent --show-error --max-time 60 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/reminders"
